<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Jazz Music Playlist Generator</title>
  </head>
  <body>
    <div class="container">
      <h1>AI Jazz Playlist Generator</h1>
      <main>
        <input
          type="text"
          id="userInput"
          placeholder="Enter a jazz artist or song..."
          autofocus
          required
          autocomplete="off"
        />
        <button id="generateButton">Generate Playlist</button>
        <div id="playlistContainer">
          Song 1
          <br />
          Song 2
        </div>
      </main>
    </div>
    <footer>
      This AI project has been coded by
      <a href="https://github.com/tpbaccam" targer="_blank">Tristine Baccam </a>
      on
      <a
        href="https://github.com/tpbaccam/jazz-music-playlist-generator"
        target="_blank"
        >Github</a
      >
      and is hosted on
      <a href=" https://jazz-playlist-generator.netlify.app/" target="_blank"
        >Netlify</a
      >.
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
