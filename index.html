<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>Jazz Music Playlist Generator</title>
  </head>
  <body>
    <div class="container">
      <h1>AI Jazz Playlist Generator</h1>
      <p class="about">
        Create your perfect jazz playlist with the power of AI! Enter an artist
        or song title below.
      </p>
      <div class="instructions-container">
        <form class="form-row" id="playlistForm">
          <input
            type="text"
            placeholder="Enter a jazz artist or song..."
            autofocus
            required
            autocomplete="off"
            class="instructions"
            id="userInput"
          />
          <input type="submit" class="generate-button" />
        </form>
        <div class="help-text">
          i.e., Alice Coltrane or "Footsteps in the Dark"
        </div>
      </div>
      <div class="playlist-container hidden" id="playlistContainer">
        <div id="playlistResults"></div>
      </div>
    </div>
    <footer>
      This AI project has been coded by
      <a href="https://github.com/tpbaccam" targer="_blank">Tristine Baccam </a>
      on
      <a
        href="https://github.com/tpbaccam/jazz-music-playlist-generator"
        target="_blank"
        >Github</a
      >
      and is hosted on
      <a href=" https://jazz-playlist-generator.netlify.app/" target="_blank"
        >Netlify</a
      >.
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
